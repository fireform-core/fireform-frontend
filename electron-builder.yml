appId: com.fireform.app
productName: FireForm
copyright: Copyright © 2026 FireForm
directories:
  output: dist
  buildResources: resources
files:
  - out/**/*
  - package.json
extraResources:
  - from: bin/
    to: bin/
    filter:
      - "**/*"
mac:
  category: public.app-category.productivity
  icon: resources/icon.icns
  darkModeSupport: true
  target: dmg
win:
  icon: resources/icon.ico
  target: nsis
linux:
  icon: resources/icon.png
  category: Utility
  target: AppImage
